<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Translation Keys 查詢工具</title>
<style>
  :root{
    --bg:#191919; --panel:#232323; --panel-2:#2c2c2c; --outline:#474747;
    --text:#ffffff; --text-2:#c8c8c8; --text-3:#7a7a7a;
    --brand:#00d2be; --pink:#f6418d; --gold:#ffa500; --info:#60c4e8;
    --green:#36d399; --yellow:#fbbd23; --red:#f87272;
    --radius:12px; --radius-sm:8px; --radius-full:999px;
    --font:"PingFang TC",-apple-system,BlinkMacSystemFont,"Microsoft JhengHei","Segoe UI",sans-serif;
    --mono:"SF Mono",ui-monospace,"Roboto Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh}
  a{color:var(--brand)}
  .wrap{max-width:1100px;margin:0 auto;padding:20px 16px 80px}

  header{margin-bottom:18px}
  h1{font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px}
  h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--text-3);flex:none;transition:background .3s,box-shadow .3s}
  h1 .dot.ok{background:var(--green);box-shadow:0 0 8px var(--green)}
  h1 .dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
  h1 .dot.load{background:var(--gold);box-shadow:0 0 8px var(--gold);animation:pulse 1s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sub{color:var(--text-3);font-size:13px;margin-top:6px}
  code{font-family:var(--mono);font-size:.92em;color:var(--info)}

  .controls{background:var(--panel);border:1px solid var(--outline);border-radius:var(--radius);padding:14px;margin-bottom:14px}
  .row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
  .row + .row{margin-top:10px}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-3)}
  input,select,button,textarea{font-family:inherit;font-size:14px;color:var(--text);background:var(--panel-2);
    border:1px solid var(--outline);border-radius:var(--radius-sm);padding:9px 12px;outline:none;height:40px}
  input:focus,select:focus,textarea:focus{border-color:var(--brand)}
  input{width:100%}
  select{cursor:pointer;min-width:170px}
  select:disabled{opacity:.45;cursor:not-allowed}
  textarea{height:auto;min-height:90px;resize:vertical;width:100%;font-family:var(--mono);font-size:13px;line-height:1.5}
  button{cursor:pointer;background:var(--panel-2);white-space:nowrap;transition:background .15s,border-color .15s}
  button:hover{background:#383838;border-color:#5a5a5a}
  button.primary{background:rgba(0,210,190,.15);border-color:var(--brand);color:var(--brand)}
  button.primary:hover{background:rgba(0,210,190,.25)}
  button.ghost{background:transparent}
  .searchwrap{position:relative;flex:1 1 280px;min-width:0}
  .searchwrap input{padding-right:34px}
  .searchwrap .x{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;height:auto;
    color:var(--text-3);font-size:18px;padding:0 4px;cursor:pointer}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;font-size:12px;color:var(--text-3);
    padding:10px 2px;border-top:1px solid var(--outline);margin-top:12px}
  .toolbar .chip{display:inline-flex;align-items:center;gap:6px}
  .toolbar b{color:var(--text);font-weight:600}
  .switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
  .switch input{display:none}
  .track{width:38px;height:22px;border-radius:var(--radius-full);background:#444;position:relative;transition:background .2s;flex:none}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
  .switch input:checked + .track{background:var(--brand)}
  .switch input:checked + .track::after{transform:translateX(16px)}
  .ring{width:16px;height:16px;border-radius:50%;border:2px solid var(--outline);border-top-color:var(--brand);flex:none}
  .ring.spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .results{background:var(--panel);border:1px solid var(--outline);border-radius:var(--radius);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
  thead th{position:sticky;top:0;background:#1f1f1f;text-align:left;font-weight:600;font-size:12px;color:var(--text-3);
    padding:10px 12px;border-bottom:1px solid var(--outline);text-transform:uppercase;letter-spacing:.5px}
  tbody td{padding:10px 12px;border-bottom:1px solid #2e2e2e;vertical-align:top;word-break:break-word}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#262626}
  .col-key{width:28%} .col-en{width:26%} .col-val{width:28%} .col-cat{width:18%}
  .keycell{display:flex;align-items:flex-start;gap:6px}
  .keytext{font-family:var(--mono);font-size:13px;color:var(--info);cursor:pointer;word-break:break-all}
  .keytext:hover{text-decoration:underline}
  .copybtn{background:none;border:none;height:auto;padding:0 2px;color:var(--text-3);font-size:13px;cursor:pointer;flex:none}
  .copybtn:hover{color:var(--text)}
  .catbadge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--radius-full);
    background:var(--panel-2);border:1px solid var(--outline);color:var(--text-2);white-space:nowrap;line-height:1.7}
  .catbadge .sub{color:var(--text-3)}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle}
  .tag.new{background:var(--green);color:#062}
  .tag.chg{background:var(--yellow);color:#5a3d00}
  mark{background:rgba(255,165,0,.32);color:inherit;border-radius:2px;padding:0 1px}
  .empty{padding:36px 16px;text-align:center;color:var(--text-3);line-height:1.9}
  .empty .start{margin-top:14px}
  .miss{color:var(--text-3);font-style:italic}
  .notice td{background:#1d1d1d;color:var(--gold);text-align:center;font-size:12px;padding:8px}
  @keyframes flashNew{from{background:rgba(54,211,153,.35)}to{background:transparent}}
  @keyframes flashChg{from{background:rgba(251,189,35,.35)}to{background:transparent}}
  tr.fx-new td{animation:flashNew 2.5s ease-out}
  tr.fx-chg td{animation:flashChg 2.5s ease-out}

  details.checker{background:var(--panel);border:1px solid var(--outline);border-radius:var(--radius);margin-bottom:14px;overflow:hidden}
  details.checker summary{cursor:pointer;padding:14px;font-weight:600;display:flex;align-items:center;gap:8px;list-style:none}
  details.checker summary::-webkit-details-marker{display:none}
  details.checker summary::before{content:"▸";color:var(--brand);transition:transform .2s}
  details.checker[open] summary::before{transform:rotate(90deg)}
  .checker-body{padding:0 14px 14px}
  .checker-body .hint{font-size:12px;color:var(--text-3);margin:0 0 8px}
  .check-summary{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:13px}
  .check-summary span{display:inline-flex;align-items:center;gap:6px}
  .check-list{display:flex;flex-direction:column;gap:6px;max-height:320px;overflow:auto}
  .check-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--radius-sm);background:var(--panel-2);font-size:13px}
  .check-item .k{font-family:var(--mono);font-size:13px;flex:none}
  .check-item .v{color:var(--text-2);margin-left:auto;text-align:right;word-break:break-word}
  .check-item.found{border-left:3px solid var(--green)}
  .check-item.missing{border-left:3px solid var(--red)}
  .ico{font-weight:700;flex:none}
  .ico.ok{color:var(--green)} .ico.no{color:var(--red)}
  .banner{font-size:12px;color:var(--gold);background:rgba(255,165,0,.08);border:1px solid rgba(255,165,0,.3);
    border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:14px;display:none}
  .banner.show{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span id="status-dot" class="dot"></span>Translation Keys 查詢工具</h1>
    <div class="sub">即時比對 <code id="ep">api.swag.live/translations</code> 的翻譯鍵。開始查詢後每 30 秒自動刷新,新上傳的 key 會即時亮起。</div>
  </header>

  <div id="cors-banner" class="banner">
    ⚠️ 無法連線到翻譯 API。可能原因:尚未登入網域、CORS 限制、或網路問題。請於 <b>swag.live</b> 同網域下開啟此頁。
  </div>

  <details class="checker" id="checker">
    <summary>📋 批次檢查:確認 keys 是否已上傳</summary>
    <div class="checker-body">
      <p class="hint">把你剛上傳的 key 貼進來(每行一個,或用逗號 / 空白分隔)。下方會即時顯示哪些已存在、哪些還沒上傳,每 30 秒自動更新。</p>
      <textarea id="check-input" placeholder="例如:&#10;billing_address&#10;order_id&#10;my_new_key"></textarea>
      <div class="check-summary" id="check-summary"></div>
      <div class="check-list" id="check-list"></div>
    </div>
  </details>

  <div class="controls">
    <div class="row">
      <div class="searchwrap">
        <input id="search" type="search" placeholder="🔍 模糊搜尋:key 名稱、英文或翻譯文字…(按 / 快速聚焦)" autocomplete="off">
        <button class="x" id="search-clear" title="清除" aria-label="清除">×</button>
      </div>
      <label class="fld">主分類
        <select id="category"><option value="">全部分類</option></select>
      </label>
      <label class="fld">子分類
        <select id="subcategory" disabled><option value="">全部</option></select>
      </label>
      <label class="fld">顯示語言
        <select id="lang">
          <option value="zh-tw">繁體中文 (zh-tw)</option>
          <option value="zh-cn">简体中文 (zh-cn)</option>
          <option value="en">English (en)</option>
          <option value="ja">日本語 (ja)</option>
        </select>
      </label>
    </div>
    <div class="toolbar">
      <label class="switch"><input type="checkbox" id="auto" checked><span class="track"></span>自動刷新</label>
      <span class="chip"><span id="ring" class="ring"></span><span id="refresh-text">待查詢</span></span>
      <button id="refresh-btn" class="ghost" style="height:30px;padding:4px 12px">立即刷新</button>
      <span class="chip">最後更新:<b id="last-updated">—</b></span>
      <span class="chip">總 keys:<b id="total-count">0</b></span>
      <span class="chip">符合結果:<b id="result-count">0</b></span>
      <span class="chip" id="diff-chip" style="display:none"></span>
    </div>
  </div>

  <div class="results">
    <table>
      <thead><tr>
        <th class="col-key">Key</th>
        <th class="col-en" id="th-en">English</th>
        <th class="col-val" id="th-val">繁體中文</th>
        <th class="col-cat">分類</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
(function(){
  "use strict";

  const ENDPOINT = "https://api.swag.live/translations";
  const REFRESH_MS = 30000;        // 30 秒自動刷新
  const RENDER_LIMIT = 300;        // 單次最多渲染列數,避免大量 DOM 造成卡頓
  const LANG_LABEL = {"zh-tw":"繁體中文","zh-cn":"简体中文","en":"English","ja":"日本語"};

  // ---- 兩層分類 ----
  const P = {
    PAY:"💳 付款購買 Payment", ORDER:"🧾 訂單 Order", ADDR:"🏠 地址 Address",
    ACC:"👤 帳號 Account", PREF:"❤️ 偏好 Preferences", SET:"⚙️ 設定 Settings",
    MSG:"💬 訊息彈窗 Messages", ACT:"🔘 按鈕操作 Actions", SYS:"🔄 系統 System",
    GEN:"🔍 通用 General", OTHER:"📦 其他 Other"
  };
  // 規則由「最具體」到「最一般」,第一個命中者勝出。已對照截圖中英文意義校準。
  const RULES = [
    // 付款 - 信用卡
    {p:P.PAY, s:"信用卡", re:/(cardholder|card_?digit|last_?four|\bcvv\b|expir|credit_?card|card_?number)/},
    // 付款 - 付款方式
    {p:P.PAY, s:"付款方式", re:/(payment_?method|alipay|wechat_?pay|\bpaypal\b|google_?pay|apple_?pay|line_?pay)/},
    // 訂單 - 結果(購買成功/失敗/確認)→ 先於一般訊息
    {p:P.ORDER, s:"訂單結果", re:/(purchase_?succeed|purchase_?fail|order_?succeed|order_?fail|order_?confirm)/},
    // 訂單 - 流程
    {p:P.ORDER, s:"訂單流程", re:/(\border\b|order_|_order|submitting|checkout|\bcart\b)/},
    // 付款 - 鑽石 / 錢包
    {p:P.PAY, s:"鑽石/錢包", re:/(diamond|\bcoin\b|wallet|balance|recharge|top_?up|\bpoint)/},
    // 付款 - 退款 / 發票
    {p:P.PAY, s:"退款發票", re:/(refund|invoice|receipt)/},
    // 地址 - 行政區 / 郵遞(先於一般 billing/pay,避免 billing_address 誤判)
    {p:P.ADDR, s:"行政區/郵遞", re:/(postal|\bzip\b|\bstate\b|country|\bregion\b|province)/},
    // 地址 - 地址欄位
    {p:P.ADDR, s:"地址欄位", re:/(address|\bcity\b|district|street|line_?\d)/},
    // 付款 - 價格
    {p:P.PAY, s:"價格", re:/(\bprice\b|\bfee\b|\bamount\b|subtotal|total_?cost)/},
    // 付款 - 一般付款 / 帳單
    {p:P.PAY, s:"付款方式", re:/(payment|\bpay\b|billing|cashier)/},
    // 偏好 - 性別 / 語言
    {p:P.PREF, s:"性別", re:/gender/},
    {p:P.PREF, s:"語言", re:/(\blang\b|language)/},
    // 設定 - NSFW / 安全模式 / 通知 / 隱私
    {p:P.SET, s:"NSFW/安全模式", re:/(nsfw|safe_?mode|\bfilter)/},
    {p:P.SET, s:"通知", re:/notification/},
    {p:P.SET, s:"隱私", re:/privacy/},
    // 偏好 - 興趣 / 收藏 / 註冊偏好引導
    {p:P.PREF, s:"興趣收藏", re:/(register_?preference|preferences_?section|interest|favou?rite|\bfollow)/},
    {p:P.PREF, s:"興趣收藏", re:/preference/},
    // 帳號
    {p:P.ACC, s:"Email", re:/\bemail\b/},
    {p:P.ACC, s:"密碼/驗證", re:/(password|\bverify\b|verification|\botp\b|\bpin\b)/},
    {p:P.ACC, s:"登入註冊", re:/(login|log_?in|logout|log_?out|sign_?in|sign_?up|sign_?out|register)/},
    {p:P.ACC, s:"安全/封鎖", re:/(blocking|\bblock\b|\bban\b|report|restrict)/},
    {p:P.ACC, s:"個人資料", re:/(profile|nickname|user_?name|username|avatar|\bbio\b|display_?name)/},
    // 系統
    {p:P.SYS, s:"App更新", re:/(app_?update|app_?version|upgrade|new_?version)/},
    {p:P.SYS, s:"格式/分隔", re:/(sep[ae]rator|joint|_format\b|format$)/},
    {p:P.SYS, s:"載入狀態", re:/(loading|no_?result|empty|not_?found|network)/},
    // 設定 - 一般
    {p:P.SET, s:"一般設定", re:/(setting|advanced|terms)/},
    // 訊息彈窗
    {p:P.MSG, s:"成功", re:/(success|succeed)/},
    {p:P.MSG, s:"失敗/錯誤", re:/(\bfail|\berror\b|warning|invalid)/},
    {p:P.MSG, s:"提示通知", re:/(popup|message|prompt|toast|alert|dialog|notice|\btip\b|description)/},
    // 按鈕操作
    {p:P.ACT, s:"確認/取消", re:/(confirm|cancel|\bok\b|\byes\b|\bno\b|i_see)/},
    {p:P.ACT, s:"通用動作", re:/(\bbtn\b|button|retry|submit|continue|\bnext\b|\bback\b|close|\bsave\b|delete|\bedit\b|apply|\bsend\b|\bdone\b)/},
    // 通用
    {p:P.GEN, s:"標籤/狀態", re:/(\bhot\b|\bnew\b|promoted|\bmore\b|recommend|trending)/},
    {p:P.GEN, s:"搜尋", re:/search/},
    {p:P.GEN, s:"雜項", re:/(\btitle\b|subtitle|placeholder|\blabel\b|\bname\b)/}
  ];
  const catCache = new Map();      // key -> {p,s};固定不變,快取避免重複跑 regex
  function categorize(key){
    let c = catCache.get(key);
    if(c) return c;
    const k = key.toLowerCase();
    c = null;
    for(const r of RULES){ if(r.re.test(k)){ c={p:r.p,s:r.s}; break; } }
    if(!c){ const m = k.match(/^([a-z0-9]+)[_\-:]/); c = {p:P.OTHER, s: m ? m[1] : "未分類"}; }
    catCache.set(key, c);
    return c;
  }

  // ---- State ----
  const ls = {
    get:(k,d)=>{ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } },
    set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} }
  };
  const state = {
    display:{}, en:{}, enLoaded:false,
    prevDisplay:null, diffStatus:{},
    subMap:{},
    lang: ls.get("tl_lang","zh-tw"),
    search: ls.get("tl_search",""),
    category: ls.get("tl_category",""),
    subcategory: ls.get("tl_subcategory",""),
    auto: ls.get("tl_auto","1") !== "0",
    started:false, fetching:false, everLoaded:false,
    dataVersion:0, catVersion:-1, lastSig:""
  };

  const $ = id => document.getElementById(id);
  const els = {
    dot:$("status-dot"), cors:$("cors-banner"),
    search:$("search"), searchClear:$("search-clear"),
    category:$("category"), subcategory:$("subcategory"), lang:$("lang"),
    auto:$("auto"), ring:$("ring"), refreshText:$("refresh-text"),
    refreshBtn:$("refresh-btn"), lastUpdated:$("last-updated"),
    totalCount:$("total-count"), resultCount:$("result-count"), diffChip:$("diff-chip"),
    tbody:$("tbody"), thVal:$("th-val"), thEn:$("th-en"),
    checkInput:$("check-input"), checkSummary:$("check-summary"), checkList:$("check-list"),
    checker:$("checker")
  };

  // 還原控制項
  els.search.value = state.search;
  els.lang.value = state.lang;
  els.auto.checked = state.auto;
  els.checkInput.value = ls.get("tl_checklist","");
  if(ls.get("tl_checker_open","0")==="1") els.checker.open = true;
  updateValHeader();

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function highlight(text,q){
    text=String(text);
    if(!q) return esc(text);
    const i=text.toLowerCase().indexOf(q.toLowerCase());
    if(i<0) return esc(text);
    return esc(text.slice(0,i))+"<mark>"+esc(text.slice(i,i+q.length))+"</mark>"+esc(text.slice(i+q.length));
  }
  function colspan(){ return state.lang==="en" ? 3 : 4; }
  function updateValHeader(){
    els.thVal.textContent = LANG_LABEL[state.lang] || state.lang;
    const showEn = state.lang !== "en";
    els.thEn.style.display = showEn ? "" : "none";
    document.querySelector(".col-en").style.width = showEn ? "26%" : "0";
    document.querySelector(".col-val").style.width = showEn ? "28%" : "54%";
  }
  function normalize(json){
    if(json && typeof json==="object" && !Array.isArray(json)){
      if(json.translations && typeof json.translations==="object") return json.translations;
      if(json.data && typeof json.data==="object" && !Array.isArray(json.data)) return json.data;
      return json;
    }
    return {};
  }
  async function fetchLang(lang){
    const res = await fetch(ENDPOINT+"?lang="+encodeURIComponent(lang),{headers:{"Accept":"application/json"},cache:"no-store",mode:"cors"});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return normalize(await res.json());
  }

  // ---- Idle / 開始 ----
  function showIdle(){
    els.tbody.innerHTML =
      `<tr><td colspan="${colspan()}" class="empty">尚未載入翻譯資料。<br>輸入關鍵字、選擇分類,或點下方按鈕即可開始查詢。`
      + `<div class="start"><button class="primary" id="start-btn" style="height:38px;padding:0 18px">開始查詢(載入翻譯)</button></div></td></tr>`;
    els.dot.className = "dot";
    els.refreshText.textContent = state.auto ? "待查詢" : "待查詢(自動刷新關閉)";
  }
  function ensureStarted(){
    if(state.started) return;
    state.started = true;
    els.tbody.innerHTML = `<tr><td colspan="${colspan()}" class="empty">載入中…</td></tr>`;
    refresh({forceEn:true});
    if(state.auto) startTimer();
  }

  // ---- Fetch ----
  let timer=null, tickTimer=null, countdown=REFRESH_MS/1000;

  async function refresh(opts){
    opts = opts || {};
    if(state.fetching) return;
    state.fetching = true;
    els.dot.className = "dot load";
    els.ring.classList.add("spin");
    try{
      const lang = state.lang;
      const needEn = lang !== "en";
      const fetchEnNow = needEn && (!state.enLoaded || opts.forceEn);
      const [disp, en] = await Promise.all([
        fetchLang(lang),
        fetchEnNow ? fetchLang("en") : Promise.resolve(null)
      ]);

      // diff
      const diff={}; let added=0,changed=0,removed=0;
      if(state.prevDisplay){
        for(const k in disp){
          if(!(k in state.prevDisplay)){diff[k]="new";added++;}
          else if(state.prevDisplay[k]!==disp[k]){diff[k]="chg";changed++;}
        }
        for(const k in state.prevDisplay){ if(!(k in disp)) removed++; }
      }
      state.diffStatus = diff;
      state.prevDisplay = disp;
      state.display = disp;
      if(en){ state.en = en; state.enLoaded = true; }
      else if(lang==="en"){ state.en = disp; }
      if(added||changed||removed || !state.everLoaded) state.dataVersion++;
      state.everLoaded = true;

      els.dot.className = "dot ok";
      els.cors.classList.remove("show");
      els.lastUpdated.textContent = new Date().toLocaleTimeString("zh-TW",{hour12:false});
      els.totalCount.textContent = Object.keys(disp).length;

      if(added||changed||removed){
        const parts=[];
        if(added) parts.push(`<b style="color:var(--green)">+${added} 新增</b>`);
        if(changed) parts.push(`<b style="color:var(--yellow)">${changed} 更新</b>`);
        if(removed) parts.push(`<b style="color:var(--red)">-${removed} 移除</b>`);
        els.diffChip.style.display=""; els.diffChip.innerHTML = parts.join(" / ");
        setTimeout(()=>{ els.diffChip.style.display="none"; }, 12000);
      }

      rebuildCategoryOptions();
      render(true);
      renderChecker();
    }catch(err){
      els.dot.className="dot err";
      els.lastUpdated.textContent = "失敗 ("+err.message+")";
      els.cors.classList.add("show");
      if(!state.everLoaded){
        els.tbody.innerHTML = `<tr><td colspan="${colspan()}" class="empty">無法載入:${esc(err.message)}<br><br>請在 swag.live 同網域環境開啟,或確認網路 / 登入狀態。<div class="start"><button class="primary" id="start-btn" style="height:38px;padding:0 18px">重試</button></div></td></tr>`;
      }
    }finally{
      state.fetching=false;
      els.ring.classList.remove("spin");
    }
  }

  function rebuildCategoryOptions(){
    if(state.catVersion === state.dataVersion) return;   // 只有資料異動才重建,省效能
    state.catVersion = state.dataVersion;
    const pCounts={}, subMap={};
    for(const k in state.display){
      const {p,s}=categorize(k);
      pCounts[p]=(pCounts[p]||0)+1;
      (subMap[p]=subMap[p]||{}); subMap[p][s]=(subMap[p][s]||0)+1;
    }
    state.subMap = subMap;
    const total = Object.keys(state.display).length;
    const cats = Object.keys(pCounts).sort((a,b)=>a.localeCompare(b,"zh-Hant"));
    let html = `<option value="">全部分類 (${total})</option>`;
    for(const c of cats) html += `<option value="${esc(c)}">${esc(c)} (${pCounts[c]})</option>`;
    els.category.innerHTML = html;
    els.category.value = pCounts[state.category] ? state.category : "";
    state.category = els.category.value;
    rebuildSubOptions();
  }
  function rebuildSubOptions(){
    const p = state.category;
    if(!p){
      els.subcategory.innerHTML = `<option value="">全部</option>`;
      els.subcategory.disabled = true;
      state.subcategory = "";
      return;
    }
    const subs = state.subMap[p] || {};
    const total = Object.values(subs).reduce((a,b)=>a+b,0);
    const names = Object.keys(subs).sort((a,b)=>a.localeCompare(b,"zh-Hant"));
    let html = `<option value="">全部子分類 (${total})</option>`;
    for(const s of names) html += `<option value="${esc(s)}">${esc(s)} (${subs[s]})</option>`;
    els.subcategory.innerHTML = html;
    els.subcategory.disabled = false;
    els.subcategory.value = subs[state.subcategory] ? state.subcategory : "";
    state.subcategory = els.subcategory.value;
  }

  function filtered(){
    const q = state.search.trim().toLowerCase();
    const pc = state.category, sc = state.subcategory;
    const out=[];
    for(const k in state.display){
      const {p,s} = categorize(k);
      if(pc && p!==pc) continue;
      if(sc && s!==sc) continue;
      const val = state.display[k];
      const en = state.en[k] || "";
      if(q){
        if(k.toLowerCase().indexOf(q)<0 &&
           String(val).toLowerCase().indexOf(q)<0 &&
           String(en).toLowerCase().indexOf(q)<0) continue;
      }
      out.push({key:k,val,en,p,s});
    }
    out.sort((a,b)=>a.key.localeCompare(b.key));
    return out;
  }

  function render(allowFlash){
    if(!state.started) return;
    const rows = filtered();
    els.resultCount.textContent = rows.length;
    // 便宜的簽章:資料版本 + 篩選條件;不變就不重繪,避免每次刷新閃爍
    const sig = [state.lang,state.search,state.category,state.subcategory,state.dataVersion].join("|");
    if(sig===state.lastSig && !allowFlash) return;
    if(sig===state.lastSig && allowFlash){ /* 同資料但需套用 flash 時仍重繪一次 */ }
    state.lastSig = sig;

    if(!rows.length){
      els.tbody.innerHTML = `<tr><td colspan="${colspan()}" class="empty">${state.everLoaded?"找不到符合條件的翻譯鍵":"載入中…"}</td></tr>`;
      return;
    }
    const showEn = state.lang!=="en";
    const q = state.search.trim();
    const limited = rows.slice(0, RENDER_LIMIT);
    let html="";
    for(const r of limited){
      const st = allowFlash ? state.diffStatus[r.key] : null;
      const rowClass = st==="new"?"fx-new":st==="chg"?"fx-chg":"";
      const tag = st==="new"?'<span class="tag new">NEW</span>':st==="chg"?'<span class="tag chg">更新</span>':"";
      html += `<tr class="${rowClass}">`
        + `<td><div class="keycell"><button class="copybtn" data-copy="${esc(r.key)}" title="複製 key">⧉</button>`
        + `<span class="keytext" data-copy="${esc(r.key)}">${highlight(r.key,q)}</span>${tag}</div></td>`;
      if(showEn) html += `<td>${highlight(r.en,q)}</td>`;
      html += `<td>${highlight(r.val,q)}</td>`
        + `<td><span class="catbadge">${esc(r.p)}<br><span class="sub">└ ${esc(r.s)}</span></span></td></tr>`;
    }
    if(rows.length > RENDER_LIMIT){
      html += `<tr class="notice"><td colspan="${colspan()}">顯示前 ${RENDER_LIMIT} 筆 / 共 ${rows.length} 筆,請用搜尋或分類縮小範圍</td></tr>`;
    }
    els.tbody.innerHTML = html;
  }

  // ---- 批次檢查 ----
  function parseCheckKeys(){ return els.checkInput.value.split(/[\s,]+/).map(s=>s.trim()).filter(Boolean); }
  function renderChecker(){
    const keys = parseCheckKeys();
    if(!keys.length){ els.checkSummary.innerHTML=""; els.checkList.innerHTML=""; return; }
    let found=0,missing=0,html=""; const seen=new Set();
    for(const k of keys){
      if(seen.has(k)) continue; seen.add(k);
      const exists = Object.prototype.hasOwnProperty.call(state.display,k);
      if(exists) found++; else missing++;
      const val = !state.started ? '<span class="miss">尚未載入</span>'
                : exists ? esc(state.display[k]) : '<span class="miss">尚未上傳</span>';
      html += `<div class="check-item ${exists?"found":"missing"}"><span class="ico ${exists?"ok":"no"}">${exists?"✓":"✗"}</span>`
        + `<span class="k">${esc(k)}</span><span class="v">${val}</span></div>`;
    }
    els.checkSummary.innerHTML =
      `<span><span class="ico ok">✓</span> 已存在 <b style="color:var(--green)">${found}</b></span>`
      + `<span><span class="ico no">✗</span> 缺少 <b style="color:var(--red)">${missing}</b></span>`
      + `<span>共 <b>${seen.size}</b> 個</span>`;
    els.checkList.innerHTML = html;
  }

  // ---- Timer ----
  function startTimer(){
    stopTimer();
    countdown = REFRESH_MS/1000;
    els.refreshText.textContent = "下次更新 "+countdown+"s";
    timer = setInterval(()=>refresh(), REFRESH_MS);
    tickTimer = setInterval(()=>{
      countdown--; if(countdown<0) countdown=REFRESH_MS/1000;
      els.refreshText.textContent = "下次更新 "+countdown+"s";
    },1000);
  }
  function stopTimer(){ if(timer)clearInterval(timer); if(tickTimer)clearInterval(tickTimer); timer=tickTimer=null; }
  function applyAuto(){
    if(!state.started){ els.refreshText.textContent = state.auto?"待查詢":"待查詢(自動刷新關閉)"; return; }
    if(state.auto) startTimer();
    else { stopTimer(); els.refreshText.textContent="自動刷新已暫停"; }
  }

  // ---- Events ----
  let dbc;
  els.search.addEventListener("input", ()=>{
    state.search = els.search.value; ls.set("tl_search",state.search);
    ensureStarted();
    clearTimeout(dbc); dbc=setTimeout(()=>render(false),120);
  });
  els.searchClear.addEventListener("click", ()=>{
    els.search.value=""; state.search=""; ls.set("tl_search","");
    render(false); els.search.focus();
  });
  els.category.addEventListener("change", ()=>{
    state.category = els.category.value; ls.set("tl_category",state.category);
    state.subcategory=""; ls.set("tl_subcategory","");
    rebuildSubOptions();
    ensureStarted(); render(false);
  });
  els.subcategory.addEventListener("change", ()=>{
    state.subcategory = els.subcategory.value; ls.set("tl_subcategory",state.subcategory);
    ensureStarted(); render(false);
  });
  els.lang.addEventListener("change", ()=>{
    state.lang = els.lang.value; ls.set("tl_lang",state.lang);
    state.prevDisplay=null; state.diffStatus={}; state.dataVersion++; state.lastSig="";
    updateValHeader();
    if(state.started) refresh({forceEn:true}); else showIdle();
  });
  els.auto.addEventListener("change", ()=>{
    state.auto = els.auto.checked; ls.set("tl_auto",state.auto?"1":"0");
    applyAuto();
  });
  els.refreshBtn.addEventListener("click", ()=>{
    if(!state.started){ ensureStarted(); return; }
    refresh({forceEn:true}); if(state.auto) startTimer();
  });
  els.checkInput.addEventListener("input", ()=>{
    ls.set("tl_checklist", els.checkInput.value);
    ensureStarted(); renderChecker();
  });
  els.checker.addEventListener("toggle", ()=> ls.set("tl_checker_open", els.checker.open?"1":"0"));

  document.addEventListener("click", e=>{
    const start = e.target.closest("#start-btn");
    if(start){ ensureStarted(); return; }
    const t = e.target.closest("[data-copy]");
    if(!t) return;
    navigator.clipboard?.writeText(t.getAttribute("data-copy")).then(()=>{
      if(t.classList.contains("copybtn")){ const o=t.textContent; t.textContent="✓"; setTimeout(()=>t.textContent=o,900); }
    }).catch(()=>{});
  });
  document.addEventListener("keydown", e=>{
    if(e.key==="/" && document.activeElement!==els.search && document.activeElement!==els.checkInput){
      e.preventDefault(); els.search.focus();
    }else if(e.key==="Escape" && document.activeElement===els.search){
      els.search.value=""; state.search=""; render(false);
    }
  });
  document.addEventListener("visibilitychange", ()=>{
    if(!state.started) return;
    if(document.hidden) stopTimer();
    else if(state.auto){ refresh(); startTimer(); }
  });

  // ---- Go (預設不載入,等使用者開始查詢) ----
  showIdle();
  renderChecker();
})();
</script>
</body>
</html>
